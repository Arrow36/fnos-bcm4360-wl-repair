name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check Bash syntax
        run: |
          bash -n src/fnos-bcm4360-oneclick.sh
          for script in packaging/fpk/cmd/*; do bash -n "$script"; done

      - name: Build FPK
        run: python scripts/build_fpk.py

      - name: Verify FPK
        run: python scripts/verify_fpk.py

      - name: Verify reproducible build
        shell: bash
        run: |
          first_sha="$(sha256sum dist/fnos-bcm4360-wl-repair_1.0.0_x86_64.fpk | cut -d' ' -f1)"
          python scripts/build_fpk.py
          second_sha="$(sha256sum dist/fnos-bcm4360-wl-repair_1.0.0_x86_64.fpk | cut -d' ' -f1)"
          test "$first_sha" = "$second_sha"

      - name: Upload validated artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fnos-bcm4360-wl-repair-${{ github.sha }}
          path: dist/
          if-no-files-found: error
